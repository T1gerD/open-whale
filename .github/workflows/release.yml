name: release

# Builds the distributables and publishes them as a GitHub Release:
#   * dsh-openwhale-<version>.tgz — the computer plugin (installed with
#     `dsh plugin --profile <p> add <tarball>`); `dsh-openwhale.tgz` is a stable
#     alias so the plugin-market entry can link `releases/latest/download/…`
#   * open-whale-<version>.apk    — the Android app; `open-whale.apk` is the stable alias
#   * SHA256SUMS.txt              — checksums for every asset
#
# Since 2.2.0 the plugin tarball also carries the web/PWA client
# (`webchat/`, served at `/openwhale/app`), which is what makes the same build
# usable from HarmonyOS and iOS browsers without an app store.
#
# The APK is built here rather than in the repository author's environment because
# that machine has no JDK and no Android SDK. GitHub's runners do, and this also
# makes every release reproducible by anyone who can push a tag.
on:
  push:
    tags: ['v*']
  # Manual runs exist because a tag created through the API (`POST /git/refs`) does
  # not fire the `push` event, so a tag made by tooling would otherwise never build.
  # Pass the tag to publish; checkout then builds exactly that ref.
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并发布的 tag（例如 v1.0.5）；留空则只构建并上传 artifact'
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # An explicit ref is required for manual runs; for tag pushes this resolves
          # to the pushed tag anyway.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read versions from the repository
        id: meta
        run: |
          node -e "
            const p=require('./packages/plugin/package.json');
            const m=require('./packages/mobile/package.json');
            if(p.version!==m.version) throw new Error('plugin and mobile versions differ: '+p.version+' vs '+m.version);
            const fs=require('fs');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'version='+p.version+'\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'tag=v'+p.version+'\n');
          "

      # No install step: every suite in this repository runs against a bare Node.
      - name: Run all test suites
        run: node scripts/run-tests.mjs

      - name: Build the plugin tarball
        run: node scripts/build-plugin-package.mjs

      # --- Android app -------------------------------------------------------

      - uses: pnpm/action-setup@v4
        # No explicit version: the action reads `packageManager` from
        # package.json. Passing both is what made this step fail.
        with:
          run_install: false

      - name: Install workspace dependencies
        # Installed at the repo root so the workspace link for
        # `@openwhale/protocol` resolves. The mobile app's Metro config also points
        # at the root `node_modules`, which is how Expo expects a pnpm monorepo.
        run: pnpm install --no-frozen-lockfile

      - name: Align Expo package versions
        working-directory: packages/mobile
        # A few Expo packages are declared as "*". Pin them to the versions that
        # match the pinned Expo SDK so a brand-new upstream release cannot break
        # the build. Advisory: if the Expo CLI cannot reach the registry we carry
        # on with what the resolver installed and let prebuild/Gradle decide.
        run: |
          npx --yes expo install --check || true
          npx --yes expo install --fix || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check the preinstalled Android SDK
        # Deliberately not `android-actions/setup-android`: that action tries to
        # install the legacy `tools` package, which no longer exists, and fails the
        # whole job ("Failed to find package 'tools'"). The ubuntu runner image
        # already ships a complete SDK, and Gradle downloads any missing component
        # once the licences are accepted.
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "no Android SDK at $SDK"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          ls "$SDK"

      - name: Accept the Android SDK licences
        # A fresh runner usually has these accepted; doing it explicitly means Gradle
        # can auto-download whatever build-tools/platform version the project asks for
        # instead of failing halfway through the build.
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || \
          yes | "${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager" --licenses > /dev/null 2>&1 || \
          echo "::warning::could not accept the SDK licences automatically; Gradle may need preinstalled components"

      - name: Generate the Android project
        working-directory: packages/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Point Gradle at the SDK
        working-directory: packages/mobile/android
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Build the release APK
        working-directory: packages/mobile/android
        run: |
          chmod +x ./gradlew
          # Release build, signed with the debug keystore: installable for personal
          # use without keeping a keystore in CI. See docs/mobile-build.md for how to
          # sign a distributable build.
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect the APK
        run: |
          set -euo pipefail
          mkdir -p release
          APK="$(find packages/mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n1)"
          if [ -z "$APK" ]; then echo "no APK produced"; exit 1; fi
          cp "$APK" "release/open-whale-${{ steps.meta.outputs.version }}.apk"
          # Stable name for `releases/latest/download/open-whale.apk` links.
          cp "$APK" "release/open-whale.apk"
          ls -lh release/

      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: open-whale-${{ steps.meta.outputs.version }}
          path: release/*
          if-no-files-found: error

      # Optional: publish `dsh-openwhale` to npm when the repository carries an
      # NPM_TOKEN secret. The plugin-market catalog picks the package up from the
      # registry automatically (its `repository` field points back at this repo),
      # and npm installs skip the build-approval step for users.
      - name: Publish to npm (only when NPM_TOKEN is configured)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not configured for this repository — skipping npm publish."
            exit 0
          fi
          node scripts/build-plugin-package.mjs --npm-dir
          npm publish release/npm-package --access public --registry=https://registry.npmjs.org/

      # Publish when there is a tag to publish: either this run was triggered by a tag
      # push, or a tag was named in the manual inputs.
      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Open Whale ${{ inputs.tag || github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: release/*
