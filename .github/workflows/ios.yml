name: ios

# iOS 模拟器冒烟构建。
#
# 定位：**验证配置没有坏**，不是分发通道。
#   * 不需要 Apple 开发者账号 / 证书 / provisioning：xcodebuild 用
#     CODE_SIGNING_ALLOWED=NO 只编模拟器 Debug 产物；
#   * 产物是未签名 .app（zip），只能装进 macOS 上的 iOS Simulator，不能装真机；
#   * 真机 / TestFlight 走 EAS Build（见 docs/iOS-HarmonyOS.md）。
#
# 触发条件（macOS runner 按分钟计费，私有仓库成本约为 Linux 的 10 倍，故刻意收窄）：
#   1. workflow_dispatch：手动，任意分支；
#   2. pull_request：只改 packages/mobile/** 或本工作流时；
#   3. push tag v*：发版时留一份可下载的模拟器包做回归。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/mobile/**'
      - '.github/workflows/ios.yml'
  push:
    tags: ['v*']

# 同一 ref 只保留最新一次，避免排队烧分钟。
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator:
    name: iOS simulator (unsigned)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 不写 version：action 从根 package.json 的 packageManager 读取（pnpm@9.15.0）。
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Show toolchain versions
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun swift --version
          xcode-select -p
          node --version
          pnpm --version

      - name: Select an Xcode with Swift 6.2+
        # The prebuilt-RN path in ExpoModulesJSI resolves a SwiftPM dependency that
        # declares `swift-tools-version: 6.2`. The default Xcode on `macos-15`
        # (16.4) ships Swift 6.1, and xcodebuild then fails with
        #   package 'apple' is using Swift tools version 6.2.0 but the installed version is 6.1.0
        # Runner images usually keep several Xcodes under /Applications; pick the
        # newest one reporting Swift >= 6.2. If none does, keep the default and warn
        # instead of failing here — the build step will carry the real diagnostics.
        run: |
          set -euo pipefail
          echo "available Xcodes:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          best=""
          best_ver="0.0"
          for app in /Applications/Xcode*.app; do
            [ -d "$app/Contents/Developer" ] || continue
            raw="$(DEVELOPER_DIR="$app/Contents/Developer" xcrun swift --version 2>/dev/null | head -n1 || true)"
            echo "  $app -> ${raw:-unknown}"
            ver="$(printf '%s' "$raw" | sed -nE 's/.*[Vv]ersion ([0-9]+)\.([0-9]+).*/\1.\2/p')"
            [ -n "$ver" ] || continue
            major="${ver%%.*}"
            minor="${ver##*.}"
            if [ "$major" -gt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -ge 2 ]; }; then
              if [ -z "$best" ] || [ "$(printf '%s\n%s\n' "$best_ver" "$ver" | sort -V | tail -n1)" = "$ver" ]; then
                best="$app"
                best_ver="$ver"
              fi
            fi
          done
          if [ -n "$best" ]; then
            echo "selecting $best (Swift $best_ver)"
            sudo xcode-select -s "$best/Contents/Developer"
          else
            echo "::warning::no installed Xcode reports Swift >= 6.2; keeping the default — SwiftPM resolution may fail"
          fi
          xcodebuild -version
          xcrun swift --version

      - name: Install workspace dependencies
        # 与 .github/workflows/release.yml 一致：仓库没有提交 lockfile，
        # 依赖装到仓库根，workspace link (@openwhale/protocol) 才能解析。
        run: pnpm install --no-frozen-lockfile

      - name: Align Expo package versions
        working-directory: packages/mobile
        # 若 package.json 里有 "*" 版本，先对齐到当前 Expo SDK；网络抖动失败不阻断，
        # 后面 prebuild / pod install 会用解析器的结果。
        run: npx expo install --fix || true

      - name: Prebuild iOS project
        working-directory: packages/mobile
        # --no-install：CocoaPods 在下一步单独跑，失败信息更清楚。
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: packages/mobile/ios
        run: |
          set -euo pipefail
          pod install --repo-update

      - name: Resolve Xcode workspace and scheme
        id: xcode
        working-directory: packages/mobile/ios
        # 不硬编码 scheme：prebuild 生成的 scheme 名取决于 app name，升级 Expo SDK 后
        # 可能变化；`xcodebuild -list -json` 是唯一可靠来源。
        # 关键：workspace 里同时存在大量 Pods scheme（Expo / ExpoModulesPackage /
        # React-* / hermes …），构建它们只会得到 Pods 产物、**不会产出 .app**。
        # 之前误选了 `Expo` scheme，于是 "BUILD SUCCEEDED" 但 Products 为空。
        # 因此优先选与 app name（去掉空格）同名的 scheme，否则排除所有 Pods 前缀。
        run: |
          set -euo pipefail
          WORKSPACE="$(ls -d *.xcworkspace | head -n 1)"
          test -n "$WORKSPACE"
          # working-directory 是 packages/mobile/ios，app.json 在上一级。
          APP_NAME="$(node -p "require('../app.json').expo.name" 2>/dev/null || true)"
          SCHEME="$(xcodebuild -list -json -workspace "$WORKSPACE" | APP_NAME="$APP_NAME" node -e '
            let raw = "";
            process.stdin.on("data", chunk => { raw += chunk; });
            process.stdin.on("end", () => {
              const info = JSON.parse(raw);
              const list = (info.workspace && info.workspace.schemes)
                || (info.project && info.project.schemes)
                || [];
              console.error("available schemes: " + list.join(", "));
              const compact = (process.env.APP_NAME || "").replace(/\s+/g, "");
              // Pods 会注册大量 scheme（Expo、EX*、React-*、FBLazyVector、hermes …），
              // 构建它们的产物是 framework 而不是 .app。优先精确匹配 app name。
              const isPod = name => /^(Pods|Expo|EX[A-Z]|React|RCT|RN|FB|hermes|Yoga|Folly|DoubleConversion|glog|fmt|boost)/i.test(name);
              const exact = compact
                ? list.find(name => name.replace(/\s+/g, "").toLowerCase() === compact.toLowerCase())
                : undefined;
              const app = exact || list.find(name => !isPod(name));
              if (exact) console.error("scheme matched by app name: " + exact);
              process.stdout.write((app || "").trim());
            });
          ')"
          test -n "$SCHEME"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "workspace=$WORKSPACE scheme=$SCHEME (app name: ${APP_NAME:-unknown})"

      - name: Build for iOS Simulator (no signing)
        working-directory: packages/mobile/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify and package .app
        working-directory: packages/mobile/ios
        run: |
          set -euo pipefail
          # Don't assume the product directory name: Xcode has moved it around
          # between versions (`Debug-iphonesimulator`, or a device-suffixed name for
          # a generic destination). Find the built .app anywhere under derived data
          # and fail with a listing if there is none, so a failure is actionable.
          APP_PATH="$(find build -maxdepth 6 -type d -name '*.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "no .app produced; derived data contents:"
            find build -maxdepth 5 -type d -name 'Products' -o -maxdepth 5 -type d -name '*.app' || true
            find build -maxdepth 3 -type d | head -n 40 || true
            exit 1
          fi
          echo "built: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ios-simulator-app.zip
          ls -la ios-simulator-app.zip

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: open-whale-ios-simulator-${{ github.sha }}
          path: packages/mobile/ios/ios-simulator-app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## iOS 模拟器冒烟"
            echo ""
            echo "- 触发：\`${{ github.event_name }}\` / \`${{ github.ref }}\`"
            echo "- 产物：\`open-whale-ios-simulator-${{ github.sha }}\`（未签名 .app zip）"
            echo "- 安装方式（只在 macOS）：解压后 \`xcrun simctl install booted <App>.app\`"
            echo "- 说明：未签名模拟器包不能装真机；TestFlight 走 EAS Build（docs/iOS-HarmonyOS.md）"
          } >> "$GITHUB_STEP_SUMMARY"
