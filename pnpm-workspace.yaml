packages:
  - packages/*

# `qrcode` is the only runtime dependency, and its own deps (dijkstrajs, pngjs,
# yargs) must be resolvable from packages/plugin/src. The default isolated linker
# marks them "private" and does not hoist them, so a plain `require` inside the
# CJS qrcode package cannot find them. The hoisted linker keeps the tree flat and
# makes the module resolvable from any package in the workspace.
nodeLinker: hoisted
# 必须与 pnpm-lock.yaml 的 `settings.autoInstallPeers` 保持一致（那里记录的是
# true）。两者不一致时 `pnpm install --frozen-lockfile` 直接报
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH，发布流水线只能退回 --no-frozen-lockfile，
# 每次构建重新解析依赖树、产物不可复现。若以后要改这项，得同时重生成 lockfile。
autoInstallPeers: true
